ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 8080
Listen 8443
PidFile /tmp/httpd.pid
DefaultRuntimeDir /tmp
Mutex file:/tmp default

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule alias_module modules/mod_alias.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

User www-data
Group www-data
ServerTokens Prod
ServerSignature Off
UseCanonicalName Off
UseCanonicalPhysicalPort Off
Timeout 15
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%m %U %>s" fixture
CustomLog /proc/self/fd/1 fixture
TypesConfig conf/mime.types

DocumentRoot "/usr/local/apache2/htdocs"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/usr/local/apache2/htdocs">
    Require all granted
</Directory>

DavLockDB /var/dav/locks/lockdb
Alias /dav/ /var/dav/data/
<Directory "/var/dav/data">
    Dav On
    DavDepthInfinity Off
    DavMinTimeout 1
    Options None
    AuthType Basic
    AuthName "Fetch WebDAV fixture"
    AuthUserFile /usr/local/apache2/conf/test-users
    Require valid-user
    LimitXMLRequestBody 1048576
</Directory>

SSLSessionCache shmcb:/tmp/ssl-cache(512000)
<VirtualHost *:8443>
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile conf/test-cert.pem
    SSLCertificateKeyFile conf/test-key.pem
</VirtualHost>
